# corpus-ownership.toml - single source of truth for the corpus ownership
# index (PLAN-AM8). Generated view: .claude/skills/_shared/corpus-ownership.md
# Regenerate the view with: python3 scripts/ci/sync-corpus-ownership.py
#
# Realises the Single Canonical Home invariant (ARCHITECTURE.md). Seeded at
# PLAN-AM8 Step 2 from the helper-corpus restructure's per-concept ownership
# map and occurrence census (one-time read, now retired). This data source is
# the durable record; it anchors to no ephemeral working file.
#
# owns_provenance: "seeded" = concern taken from the restructure's ownership
# map or census. "provisional" = executor-authored one-line paraphrase for a
# file the census does not classify. provisional owns lines carry no
# acceptance check - the drift-check verifies structure only. Semantic
# validation of provisional rows is a maintain-project-docs follow-on.
#
# class: home-pointer-eligible | pointer | dispatch-inline |
# consumer-standalone | human-edit-only - assigned by the deterministic
# five-branch classification rule in PLAN-AM8 Step 2, never by judgement.

[scope]
# Corpus definition for the bijection check (sub-check i). Every file
# matched by include_globs or listed in include_paths, minus exclude, must
# have exactly one row below.
include_globs = [
    ".claude/skills/_shared/*.md",
    ".claude/skills/*/SKILL.md",
    ".claude/skills/*/references/*.md",
    ".claude/skills/*/workflows/*.md",
    ".claude/skills/*/templates/*.md",
    ".claude/agents/*.md",
]
include_paths = [
    ".claude/skills/init-plan-foundry/operating-rules.md",
]
exclude = [
    ".claude/skills/_shared/corpus-ownership.md",
    ".claude/skills/_shared/corpus-ownership.toml",
]

